<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Ticketspot</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">TICKETSPOT</a>
      <nav class="site-nav">
        <a href="index.html">Inicio</a>
        <a href="eventos.html">Eventos</a>
        <a data-nav="mis-boletos" href="mis-boletos.html" style="display:none;">Mis boletos</a>
        <a class="active" data-nav="login" href="login.html">Login</a>
        <a data-nav="logout" href="#" style="display:none;">Cerrar sesión</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="login-section container">
      <div class="login-card">
        <div class="card-body">
          <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active" type="button">Iniciar sesión</button>
            <button id="tab-register" class="auth-tab" type="button">Crear cuenta</button>
          </div>

          <p id="auth-mensaje" class="auth-mensaje" style="display:none;"></p>

          <form id="form-login" style="display:grid;">
            <label for="login-email">Correo</label>
            <input id="login-email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required />

            <label for="login-password">Contraseña</label>
            <input id="login-password" name="password" type="password" placeholder="••••••••" required />

            <button class="btn-primary" type="submit">Ingresar</button>
          </form>

          <form id="form-register" style="display:none;">
            <label for="register-nombre">Nombre completo</label>
            <input id="register-nombre" name="nombre" type="text" placeholder="Ej. Juan Pérez" required />

            <label for="register-email">Correo</label>
            <input id="register-email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required />

            <label for="register-password">Contraseña</label>
            <input id="register-password" name="password" type="password" placeholder="Mínimo 6 caracteres" required />

            <button class="btn-primary" type="submit">Crear cuenta</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/nav-auth.js"></script>
  <script src="../js/login.js"></script>

  <footer class="site-footer">
    <div class="container">&copy; 2026 Ticketspot. Cuenta conectada a Supabase Auth.</div>
  </footer>
</body>
</html>
